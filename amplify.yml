version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        # Amplify SSR = Lambda; prefer memory path in any build-time probes
        - export GATEX_FORCE_MEMORY=1
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
