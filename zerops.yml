# Hostname must match your Zerops service name (`nodejs`).
zerops:
  - setup: nodejs
    build:
      base: alpine/nodejs@24
      # better-sqlite3 may need a native compile on Alpine
      prepareCommands:
        - sudo apk add --no-cache python3 make g++
      buildCommands:
        - npm i
        - npm run build
      # Full tree — Next uses `.next`, not `dist` from the default template
      deployFiles: ./
      cache:
        - node_modules
        - package-lock.json
    run:
      base: alpine/nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      start: npm start
